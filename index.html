<div id="hm"></div><div class="tabbar" id="tabwrap"><div class="w"><div class="tabs" id="tabs"></div></div></div><div class="w" id="bnw" style="padding-top:10px"><span id="bn" class="wn">Memuat data…</span></div><div class="w" id="v"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}),f=n=>nf.format(n),rp=n=>'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5));
const empty=()=>({ponds:[],samp:[],feed:[],sales:[],water:[],hidro:[],cfg:{target:250}});
let S=empty(),ref=null,tab='dash',pid='',cal={},wq=Promise.resolve(),ro=false,LK='bioflok-data-v1';
const TABS=[['dash','📊 Dashboard'],['tebar','🏞️ Kolam & Tebar'],['pakan','🌾 Pakan & FR'],['jual','💰 Penjualan'],['air','💧 Parameter Air'],['cn','🧪 C:N Rasio']];
const frGuide=a=>a<5?8:a<20?6:a<50?4:a<100?3:a<250?2.5:2;
/* penyimpanan: db bersama jika ada, jika tidak localStorage */
function banner(t,c){const b=$('#bn');if(b){b.textContent=t;b.className=c}}
function save(){const d=JSON.parse(JSON.stringify(S));if(ref){wq=wq.then(()=>ref.set(d)).catch(e=>{ro=true;banner('Tidak bisa menyimpan (mode baca saja)','bad')})}else{try{localStorage.setItem(LK,JSON.stringify(d))}catch(e){}}}
function load(d){S=Object.assign(empty(),JSON.parse(JSON.stringify(d||{})));render()}
function local(){banner('Tersimpan di browser ini saja','wn');try{load(JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){load({})}}
async function init(){render();let db=null;try{db=await window.claude?.use('db')}catch(e){}
 if(!db){local();return}
 let got=false;const t=setTimeout(()=>{if(!got){ref=null;local()}},10000);
 ref=db.doc('bioflok/data');
 ref.onSnapshot(s=>{got=true;clearTimeout(t);banner('Data tersimpan & tersinkron','ok');load(s.exists?s.data():{})},e=>{got=true;clearTimeout(t);ref=null;local()})}
/* hitungan */
const P=id=>S.ponds.find(p=>p.id===id);
function cur(id,date){const p=P(id);if(!p)return{pop:0,abw:0};const s=S.samp.filter(x=>x.pond===id&&(!date||x.tgl<=date)).sort((a,b)=>b.tgl.localeCompare(a.tgl))[0];return s?{pop:+s.pop,abw:+s.abw,tgl:s.tgl}:{pop:+p.jml,abw:+p.abw,tgl:p.tgl}}
const bio=c=>c.pop*c.abw/1000;
function sub(e,k){e.preventDefault();if(ro)return false;const d=Object.fromEntries(new FormData(e.target));for(const x in d)if(e.target[x]?.type==='number')d[x]=d[x]===''?null:+d[x];d.id=uid();
 const m={ponds:'ponds',samp:'samp',feed:'feed',sales:'sales',water:'water',hidro:'hidro'};S[m[k]].push(d);if(k==='ponds')pid=d.id;save();render();return false}
function del(k,id){if(ro||!confirm('Hapus catatan ini?'))return;S[k]=S[k].filter(x=>x.id!==id);save();render()}
function setTab(t){tab=t;render()}function setPond(v){pid=v;cal={};render()}
const opts=(sel)=>S.ponds.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nama)}</option>`).join('');
const inp=(l,n,t='number',x='')=>`<div><label>${l}<input name="${n}" type="${t}" ${x} required></label></div>`;
const pondSel=n=>`<div><label>Kolam<select name="${n||'pond'}" required>${opts(pid)}</select></label></div>`;
const noPond='<div class="card mu">Belum ada kolam. Tambahkan dulu di tab Kolam &amp; Tebar.</div>';
/* tampilan */
function vTebar(){const tot=S.ponds.reduce((a,p)=>a+p.jml,0),pk=S.feed.reduce((a,x)=>a+x.kg,0),jl=S.sales.reduce((a,x)=>a+x.kg*x.harga,0);
 return `<div class="g card"><div class="st"><i>🏞️</i><div><b>${S.ponds.length}</b><span>Kolam</span></div></div><div class="st"><i>🐟</i><div><b>${f(tot)}</b><span>Total ekor ditebar</span></div></div><div class="st"><i>🌾</i><div><b>${f(pk)} kg</b><span>Total pakan</span></div></div><div class="st"><i>💰</i><div><b>${rp(jl)}</b><span>Total penjualan</span></div></div></div>
 <div class="card"><h2>Tambah kolam &amp; tebar</h2><form onsubmit="return sub(event,'ponds')"><div class="g">${inp('Nama kolam','nama','text','placeholder="Kolam A1"')}${inp('Volume air (m³)','vol','number','step="any" min="0"')}${inp('Tanggal tebar','tgl','date',`value="${today()}"`)}${inp('Jenis ikan','jenis','text','value="Nila merah"')}${inp('Jumlah tebar (ekor)','jml','number','min="1"')}${inp('Bobot rata-rata awal (g/ekor)','abw','number','step="any" min="0"')}</div><button class="p">Simpan tebar</button></form></div>
 <div class="card"><h2>Daftar kolam</h2>${S.ponds.length?S.ponds.map(p=>{const c=cur(p.id);return `<div class="row"><div><b>${esc(p.nama)}</b> · ${esc(p.jenis)}<div class="mu">Tebar ${p.tgl} (umur ${days(p.tgl)} hari) · ${f(p.vol)} m³</div><div class="mu">${f(p.jml)} ekor × ${f(p.abw)} g = biomassa awal ${f(p.jml*p.abw/1000)} kg · padat tebar ${f(p.vol?p.jml/p.vol:0)} ekor/m³</div><div class="mu">Terkini: ${f(c.pop)} ekor, ${f(c.abw)} g, biomassa ${f(bio(c))} kg</div></div><button class="x" onclick="del('ponds','${p.id}')">Hapus</button></div>`}).join(''):'<div class="mu">Belum ada kolam.</div>'}</div>`}
function vPakan(){if(!S.ponds.length)return noPond;if(!P(pid))pid=S.ponds[0].id;const c=cur(pid);
 if(cal.pond!==pid)cal={pond:pid,pop:c.pop,abw:c.abw,fr:frGuide(c.abw),freq:3,auto:true};
 const bm=cal.pop*cal.abw/1000,day=bm*cal.fr/100;
 const fs=S.feed.filter(x=>x.pond===pid).sort((a,b)=>b.tgl.localeCompare(a.tgl)),tp=fs.reduce((a,x)=>a+x.kg,0),p=P(pid);
 const sold=S.sales.filter(x=>x.pond===pid).reduce((a,x)=>a+x.kg,0),gain=bio(c)+sold-p.jml*p.abw/1000,fcr=gain>0&&tp>0?tp/gain:null;
 return `<div class="card"><label>Kolam<select onchange="setPond(this.value)">${opts(pid)}</select></label></div>
 <div class="card"><h2>Kalkulator FR (feeding rate)</h2><div class="mu">Pakan harian (kg) = Biomassa (kg) × FR (%) ; Biomassa = populasi × bobot rata-rata (g) ÷ 1000</div><div class="g" style="margin-top:10px">
 <div><label>Populasi (ekor)<input type="number" value="${cal.pop}" oninput="cal.pop=+this.value;calc()"></label></div>
 <div><label>Bobot rata-rata (g)<input type="number" step="any" value="${cal.abw}" oninput="cal.abw=+this.value;if(cal.auto)cal.fr=frGuide(cal.abw);calc(true)"></label></div>
 <div><label>FR (% biomassa/hari)<input id="fr" type="number" step="any" value="${cal.fr}" oninput="cal.fr=+this.value;cal.auto=false;calc()"></label></div>
 <div><label>Frekuensi pakan/hari<input type="number" min="1" value="${cal.freq}" oninput="cal.freq=+this.value;calc()"></label></div></div>
 <div class="res" id="res">${resHtml(bm,day)}</div><div class="mu" style="margin-top:8px">Acuan FR umum nila: &lt;5 g 8% · 5–20 g 6% · 20–50 g 4% · 50–100 g 3% · 100–250 g 2,5% · &gt;250 g 2%. Sesuaikan dengan nafsu makan, kadar protein pakan, dan kondisi air.</div></div>
 <div class="card"><h2>Sampling bobot</h2><form onsubmit="return sub(event,'samp')"><input type="hidden" name="pond" value="${pid}"><div class="g">${inp('Tanggal','tgl','date',`value="${today()}"`)}${inp('Bobot rata-rata (g)','abw','number','step="any" min="0"')}${inp('Populasi hidup (ekor)','pop','number','min="0"')}</div><button class="p">Simpan sampling</button></form>
 ${S.samp.filter(x=>x.pond===pid).sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,5).map(x=>`<div class="row"><div>${x.tgl} · ${f(x.abw)} g · ${f(x.pop)} ekor</div><button class="x" onclick="del('samp','${x.id}')">Hapus</button></div>`).join('')}</div>
 <div class="card"><h2>Catat pakan harian</h2><form onsubmit="return sub(event,'feed')"><input type="hidden" name="pond" value="${pid}"><div class="g">${inp('Tanggal','tgl','date',`value="${today()}"`)}${inp('Pakan diberikan (kg)','kg','number','step="any" min="0"')}</div><button class="p">Simpan pakan</button></form>
 <div class="mu" style="margin-top:8px">Total pakan ${f(tp)} kg${fcr?` · perkiraan FCR ${f(fcr)}`:''}</div>
 ${fs.slice(0,10).map(x=>{const b=bio(cur(pid,x.tgl));return `<div class="row"><div>${x.tgl} · ${f(x.kg)} kg<div class="mu">FR aktual ${b?f(x.kg/b*100):'-'}% dari biomassa ${f(b)} kg</div></div><button class="x" onclick="del('feed','${x.id}')">Hapus</button></div>`}).join('')}</div>`}
const resHtml=(bm,day)=>`Biomassa <b>${f(bm)} kg</b> → pakan harian <b>${f(day)} kg</b> (${f(day*1000)} g)<div class="mu">Per pemberian (${cal.freq}×/hari): <b>${f(day/Math.max(1,cal.freq)*1000)} g</b></div>`;
function calc(a){const bm=cal.pop*cal.abw/1000;if(a){const e=$('#fr');if(e)e.value=cal.fr}$('#res').innerHTML=resHtml(bm,bm*cal.fr/100)}

function cnDef(){const p=P(pid),c=p?cur(p.id):null,w=S.water.filter(x=>x.pond===pid).sort((a,b)=>b.tgl.localeCompare(a.tgl))[0];
